apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-nginx
  namespace: demo
data:
  default.conf: |
    server {
        listen 80;
        server_name _;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'ok\n';
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }
    }
