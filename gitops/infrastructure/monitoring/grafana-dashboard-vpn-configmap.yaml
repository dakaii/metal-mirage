apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-vpn
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  vpn-gateway.json: |
    {
      "title": "VPN Gateway",
      "timezone": "browser",
      "panels": [
        {
          "type": "stat",
          "title": "Gateway Up",
          "targets": [{ "expr": "up{job=\"vpn-gateway\"}" }]
        },
        {
          "type": "timeseries",
          "title": "Node CPU",
          "targets": [{ "expr": "rate(node_cpu_seconds_total{job=\"vpn-gateway\",mode=\"idle\"}[5m])" }]
        }
      ],
      "schemaVersion": 39,
      "version": 1
    }
