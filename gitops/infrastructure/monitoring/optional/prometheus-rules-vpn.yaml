# Optional — requires monitoring.coreos.com/v1 PrometheusRule CRD
# (install kube-prometheus-stack first). Not included in the default
# monitoring kustomization so Flux stays green without that stack.
#
# VPNGatewayDown uses node_exporter `up` (installed by vpn cloud-init).
# Peer-handshake alerts need a WireGuard exporter (not shipped in V1) — omitted.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: vpn-gateway
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: vpn-gateway
      rules:
        - alert: VPNGatewayDown
          expr: up{job="vpn-gateway"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: VPN gateway {{ $labels.city }} is down
