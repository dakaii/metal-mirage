# Lab-only dnsmasq. Requires host networking + an isolated NIC.
# Edit dnsmasq.conf.example (or mount your own conf) — compose does not expand env vars.
# Usage: see lab/pxe/README.md
services:
  dnsmasq:
    image: andyshinn/dnsmasq:2.83
    network_mode: host
    cap_add:
      - NET_ADMIN
    volumes:
      # Prefer mounting an edited copy, e.g. ./dnsmasq.conf:/etc/dnsmasq.conf:ro
      - ./dnsmasq.conf.example:/etc/dnsmasq.conf:ro
      # Optional: - /var/lib/tftpboot:/tftpboot:ro
    restart: "no"
