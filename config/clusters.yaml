# Metal-first platform switch. Layers above L1 (Flux / apps) stay the same.
#
# Preferred primary: bare-metal (on-prem Talos). Azure metal-sim is the
# "lab without hardware" path — see config/clusters.azure-metal-sim.example.yaml.
#
# Capability ports (docs/CAPABILITY-PORTS.md):
#   Compute       → primary / standby provisioners
#   RemoteAccess  → none by default; set wireguard to enable city-exit adapter
#   Lifecycle     → not implemented in OSS (BMC/power)
#   Observability → gitops/ hints
#
# Golden path: docs/METAL-PRIMARY.md
# Inventory SoT for bare-metal: primary.nodes (+ optional api_endpoint_ip, …)
#   → ./scripts/sync-baremetal-config.sh (also run by ./scripts/up.sh primary)

primary:
  provisioner: bare-metal
  pulumi_dir: infra/bare-metal
  profile: primary
  # Offline-safe defaults (dry_run: true). Replace IPs with your hardware.
  dry_run: true
  # Code default is /dev/sda; change for your hardware (often /dev/nvme0n1).
  install_disk: /dev/sda
  # api_endpoint_ip / ingress_ip default to the first controlplane IP when omitted.
  nodes:
    - role: controlplane
      ip: 192.168.1.10
    - role: worker
      ip: 192.168.1.11

standby:
  provisioner: aks
  pulumi_dir: infra/standby-aks
  profile: standby

shared:
  pulumi_dir: infra/shared

# RemoteAccess — off by default (platform / GitOps / DR only).
remote_access:
  provider: none # wireguard | none
  pulumi_dir: infra/vpn-gateways

# Legacy alias (same plane). Scripts still accept "vpn".
vpn:
  pulumi_dir: infra/vpn-gateways
