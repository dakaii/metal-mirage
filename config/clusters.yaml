# Switch provisioner per cluster. Layers above L1 stay the same.
#
# azure-metal-sim: Talos on Azure VMs (default — no home public IP required)
# bare-metal:      real hardware via infra/bare-metal (same Talos + Flux contract)
#
# Capability ports (see docs/CAPABILITY-PORTS.md):
#   Compute       → primary / standby provisioners below
#   RemoteAccess  → remote_access (WireGuard is the OSS example; set provider: none to skip)
#   Lifecycle     → not implemented in OSS (BMC/power)
#   Observability → gitops/ hints (not configured here)
#
# Example bare-metal inventory: config/clusters.bare-metal.example.yaml
# Docs: docs/PORTABLE-ARCHITECTURE.md

primary:
  provisioner: azure-metal-sim
  pulumi_dir: infra/primary
  profile: primary
  # To switch primary to real metal:
  #   1. Copy nodes from clusters.bare-metal.example.yaml
  #   2. Set provisioner: bare-metal and pulumi_dir: infra/bare-metal
  #   3. ./scripts/validate-inventory.sh && ./scripts/up.sh primary

standby:
  provisioner: aks
  pulumi_dir: infra/standby-aks
  profile: standby

shared:
  pulumi_dir: infra/shared

# RemoteAccess port — WireGuard city exit is the shipped example adapter.
# Set provider: none for platform-only bring-up (no VPN stack).
remote_access:
  provider: wireguard # wireguard | none
  pulumi_dir: infra/vpn-gateways

# Legacy alias (same plane). Scripts still accept "vpn"; prefer remote_access above.
vpn:
  pulumi_dir: infra/vpn-gateways
  # City/region come from Pulumi stack config (vpn:city / vpn:location), not this file.
