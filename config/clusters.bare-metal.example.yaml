# Example / reference bare-metal primary (same shape as default config/clusters.yaml).
# Edit IPs and disks for your hardware, then:
#   ./scripts/validate-inventory.sh
#   ./scripts/sync-baremetal-config.sh   # or just ./scripts/up.sh primary
#   # Install Talos (ISO/PXE/Omni) → maintenance mode, then:
#   # set dry_run: false below and re-sync / up
#
# Single inventory: primary.nodes here is SoT for Pulumi baremetal:* keys.

primary:
  provisioner: bare-metal
  pulumi_dir: infra/bare-metal
  profile: primary
  dry_run: true
  install_disk: /dev/nvme0n1
  api_endpoint_ip: 192.168.1.10 # optional; defaults to first controlplane
  ingress_ip: 192.168.1.10 # MetalLB / VIP / node IP serving HTTP NodePort
  nodes:
    - role: controlplane
      ip: 192.168.1.10
    - role: worker
      ip: 192.168.1.11

standby:
  provisioner: aks
  pulumi_dir: infra/standby-aks
  profile: standby

shared:
  pulumi_dir: infra/shared

remote_access:
  provider: none
  pulumi_dir: infra/vpn-gateways

vpn:
  pulumi_dir: infra/vpn-gateways
